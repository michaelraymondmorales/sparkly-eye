<svg viewBox="-6 -6 112 112" xmlns="http://www.w3.org/2000/svg">

  <filter id="soft-pop" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.333" />
  </filter>

  <defs>
    <path id="petal" d="M50,50 Q65,30 50,3 Q35,30 50,50 Z" stroke-width="3" stroke="black" />
  </defs>

  <g filter="url(#soft-pop)">

  <g id="outer-layers" >
    <use href="#petal" transform="rotate(000 50 50)" fill="#9A1AFF" />
    <use href="#petal" transform="rotate(060 50 50)" fill="#FF8C3D" />
    <use href="#petal" transform="rotate(120 50 50)" fill="#27D658" />
    <use href="#petal" transform="rotate(180 50 50)" fill="#9A1AFF" />
    <use href="#petal" transform="rotate(240 50 50)" fill="#FF8C3D" />
    <use href="#petal" transform="rotate(300 50 50)" fill="#27D658" />
  </g>
    
  <g id="inner-layers" transform="translate(50 50) scale(0.8) rotate(30) translate(-50 -50)">
    <use href="#petal" transform="rotate(000 50 50)" fill="#EE333A" />
    <use href="#petal" transform="rotate(060 50 50)" fill="#FFF31A" />
    <use href="#petal" transform="rotate(120 50 50)" fill="#535BD1" />
    <use href="#petal" transform="rotate(180 50 50)" fill="#EE333A" />
    <use href="#petal" transform="rotate(240 50 50)" fill="#FFF31A" />
    <use href="#petal" transform="rotate(300 50 50)" fill="#535BD1" />
  </g>

  <circle cx="50" cy="50" r="18" fill="black" />

</g></svg>